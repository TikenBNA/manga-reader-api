<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MangaReader</title>
<style>
  :root {
    --bg:#121212; --bg2:#1e1e1e; --bg3:#2a2a2a; --text:#e0e0e0; --dim:#888;
    --accent:#ff6b35; --r:10px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html, body { background:var(--bg); }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--text); min-height:100vh; min-height:100dvh; overscroll-behavior-y: contain;
  }
  body.reader #topbar, body.reader #activebar { display:none; }

  #topbar {
    position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    padding:calc(8px + var(--safe-t)) 12px 8px;
    background:rgba(18,18,18,.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--bg3);
  }
  .logo { font-weight:700; color:var(--accent); font-size:17px; white-space:nowrap; cursor:pointer; }
  .filters { display:flex; gap:8px; width:100%; }
  .filters button, .filters select {
    flex:1 1 0; min-width:0; background:var(--bg2); color:var(--text); border:1px solid var(--bg3);
    border-radius:8px; padding:9px 10px; font-size:13px; min-height:40px; font-family:inherit;
  }
  .filters button { cursor:pointer; text-align:left; }
  .filters button.has { border-color:var(--accent); color:#fff; }

  #activebar[hidden] { display:none; }
  #activebar { display:flex; gap:6px; overflow-x:auto; padding:8px 12px; background:var(--bg); border-bottom:1px solid var(--bg3); scrollbar-width:none; }
  #activebar::-webkit-scrollbar { display:none; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:var(--bg2); border:1px solid var(--bg3);
          color:#ddd; border-radius:16px; padding:5px 10px; font-size:12px; white-space:nowrap; }
  .pill b { font-weight:600; }
  .pill .x { color:var(--accent); font-weight:700; cursor:pointer; padding:0 2px; }
  .pill.clear { border-color:var(--accent); color:var(--accent); cursor:pointer; }

  .wrap { padding:12px; max-width:1400px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px; }
  .card { cursor:pointer; }
  .card .cover { aspect-ratio:3/4; background:var(--bg2); border-radius:var(--r); overflow:hidden; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .t { margin-top:6px; font-size:12.5px; line-height:1.3; max-height:2.6em; overflow:hidden; }
  .card .a { font-size:11px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .hero { display:flex; gap:14px; padding:12px; background:var(--bg2); border-radius:var(--r); margin-bottom:14px; }
  .hero .cover { flex:0 0 112px; aspect-ratio:3/4; border-radius:8px; overflow:hidden; background:var(--bg3); }
  .hero img { width:100%; height:100%; object-fit:cover; }
  .hero h1 { font-size:17px; line-height:1.25; margin-bottom:6px; }
  .hero .meta { color:var(--dim); font-size:12px; margin-bottom:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; max-height:52px; overflow:hidden; }
  .chips span { background:var(--bg3); border-radius:10px; padding:2px 8px; font-size:11px; color:#ccc; }

  .chapters { background:var(--bg2); border-radius:var(--r); overflow:hidden; }
  .ch { display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:48px; padding:10px 14px; border-bottom:1px solid var(--bg3); font-size:13.5px; }
  .ch:last-child { border-bottom:none; }
  .ch:active { background:var(--bg3); }
  .ch .left { min-width:0; }
  .ch .n { color:var(--accent); font-weight:600; margin-right:6px; }
  .ch .ttl { display:block; color:#bbb; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ch .d { color:var(--dim); font-size:11px; white-space:nowrap; }

  button { font-family:inherit; cursor:pointer; background:#232323; color:#ddd; border:1px solid #444;
           padding:10px 14px; border-radius:8px; font-size:14px; min-height:44px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.35; }
  .msg { color:var(--dim); text-align:center; padding:50px 16px; }
  .err { color:#ff6b6b; text-align:center; padding:24px; font-size:14px; }
  .more { padding:16px 0; display:flex; justify-content:center; }
  .more button { width:100%; max-width:420px; }

  .modal { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; }
  .modal[hidden] { display:none; }
  .sheet {
    background:var(--bg2); width:100%; max-height:82vh; border-radius:16px 16px 0 0;
    display:flex; flex-direction:column; padding-bottom:var(--safe-b);
  }
  .sheet header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--bg3); }
  .sheet header .title { font-weight:600; font-size:15px; }
  .sheet header .close { margin-left:auto; }
  .sheet .search { padding:10px 14px; }
  .sheet .search input { width:100%; background:var(--bg3); border:1px solid #3a3a3a; color:var(--text);
                         border-radius:8px; padding:10px 12px; font-size:14px; }
  .taglist { overflow-y:auto; padding:4px 12px 12px; display:flex; flex-wrap:wrap; gap:8px; }
  .taglist button {
    background:var(--bg3); border:1px solid #3a3a3a; color:#ddd; border-radius:16px;
    padding:7px 12px; font-size:12.5px; min-height:36px;
  }
  .taglist button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .sheet footer { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--bg3); }
  .sheet footer button { flex:1; }

  .reader-view { background:#000; }
  .reader-bar {
    position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; gap:8px;
    padding:calc(6px + var(--safe-t)) 10px 6px; background:rgba(0,0,0,.9); backdrop-filter:blur(12px);
    border-bottom:1px solid #222; transition:opacity .2s, transform .2s;
  }
  .reader-bar.hidden { opacity:0; transform:translateY(-100%); pointer-events:none; }
  .reader-bar .ttl { flex:1; font-size:12.5px; color:#ddd; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reader-bar button { min-height:36px; padding:6px 10px; font-size:12.5px; }
  .reader { padding-top:calc(48px + var(--safe-t)); padding-bottom:calc(64px + var(--safe-b)); }
  .reader img { display:block; width:100%; max-width:820px; margin:0 auto; background:#111; }
  .reader-bottom {
    position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; gap:8px;
    padding:8px 10px calc(8px + var(--safe-b)); background:rgba(0,0,0,.9); backdrop-filter:blur(12px);
    border-top:1px solid #222; transition:opacity .2s;
  }
  .reader-bottom button { flex:1; }
  .tapzone { position:fixed; top:0; bottom:0; width:30%; z-index:25; }
  .tapzone.left { left:0; }
  .tapzone.right { right:0; }
  .toast {
    position:fixed; left:50%; bottom:calc(80px + var(--safe-b)); transform:translateX(-50%);
    background:rgba(0,0,0,.85); color:#eee; padding:8px 14px; border-radius:20px; font-size:13px;
    z-index:70; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show { opacity:1; }

  @media (max-width: 420px) { .grid { grid-template-columns:repeat(2, 1fr); gap:10px; } .hero .cover { flex-basis:96px; } }
  @media (min-width: 900px) { .grid { grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:16px; } }
</style>
</head>
<body>
<header id="topbar">
  <div class="logo" id="home">MangaReader</div>
  <div class="filters">
    <button id="tagBtn">Теги</button>

    <select id="sortFilter">
      <option value="new">Новые</option>
      <option value="old">Старые</option>
    </select>
  </div>
</header>
<div id="activebar" hidden></div>

<div id="app"><div class="msg">Загрузка…</div></div>

<div class="modal" id="tagModal" hidden>
  <div class="sheet">
    <header>
      <span class="title">Теги</span>
      <button class="close" id="tagClose">Готово</button>
    </header>
    <div class="search"><input id="tagSearch" placeholder="Поиск тега…" autocomplete="off"></div>
    <div class="taglist" id="tagList"></div>
    <footer>
      <button id="tagReset">Сбросить</button>
      <button class="primary" id="tagApply">Применить</button>
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = location.origin + '/api';
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
const $ = (t, cls, txt) => { const el = document.createElement(t); if (cls) el.className = cls; if (txt != null) el.textContent = txt; return el; };

const params = new URLSearchParams(location.search);
const state = {
  tags: (params.get('tags') || '').split(',').map((s) => s.trim()).filter(Boolean),
  sort: params.get('sort') === 'old' ? 'old' : 'new',
  page: 1,
  allTags: [],
  mangaId: null,
  chapters: [],
  chapterIdx: 0,
  cache: new Map(),
};

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => toastEl.classList.remove('show'), 1500);
}

async function api(path) {
  if (state.cache.has(path)) return state.cache.get(path);
  const res = await fetch(API + path);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  state.cache.set(path, data);
  if (state.cache.size > 80) state.cache.delete(state.cache.keys().next().value);
  return data;
}

function syncUrl() {
  const p = new URLSearchParams();
  if (state.tags.length) p.set('tags', state.tags.join(','));
  if (state.sort === 'old') p.set('sort', 'old');
  const qs = p.toString();
  history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}

function mount(...nodes) {
  app.replaceChildren(...nodes);
  window.scrollTo(0, 0);
}

const tagBtn = document.getElementById('tagBtn');
const sortFilter = document.getElementById('sortFilter');
const activebar = document.getElementById('activebar');
const modal = document.getElementById('tagModal');
const tagList = document.getElementById('tagList');
const tagSearch = document.getElementById('tagSearch');

sortFilter.value = state.sort;
sortFilter.onchange = () => { state.sort = sortFilter.value; onFiltersChanged(); };

function renderTagButton() {
  const n = state.tags.length;
  tagBtn.textContent = n ? `Теги: ${n}` : 'Теги';
  tagBtn.classList.toggle('has', n > 0);
}

function renderActiveBar() {
  activebar.replaceChildren();
  if (!state.tags.length) { activebar.hidden = true; return; }
  activebar.hidden = false;
  for (const slug of state.tags) {
    const name = (state.allTags.find((t) => (t.key || t.slug) === slug) || {}).name || slug;
    const pill = $('span', 'pill');
    pill.append($('b', null, name));
    const x = $('span', 'x', '✕');
    x.onclick = () => { state.tags = state.tags.filter((s) => s !== slug); onFiltersChanged(); };
    pill.append(x);
    activebar.append(pill);
  }
  const clear = $('span', 'pill clear', 'Сбросить всё');
  clear.onclick = () => { state.tags = []; onFiltersChanged(); };
  activebar.append(clear);
}

function renderTagList() {
  const q = tagSearch.value.trim().toLowerCase();
  tagList.replaceChildren();
  const list = state.allTags.filter((t) => !q || t.name.toLowerCase().includes(q));
  if (!list.length) { tagList.append($('div', 'msg', 'Ничего не найдено')); return; }
  for (const t of list) {
    const tagVal = t.key || t.slug;
    const b = $('button', state.tags.includes(tagVal) ? 'on' : null, t.name);
    b.onclick = () => {
      state.tags = state.tags.includes(tagVal)
        ? state.tags.filter((s) => s !== tagVal)
        : [...state.tags, tagVal];
      renderTagList();
      renderTagButton();
    };
    tagList.append(b);
  }
}

function openTags() {
  renderTagList();
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeTags(apply) {
  modal.hidden = true;
  document.body.style.overflow = '';
  renderTagButton();
  renderActiveBar();
  if (apply) onFiltersChanged();
}

tagBtn.onclick = openTags;
document.getElementById('tagClose').onclick = () => closeTags(true);
document.getElementById('tagApply').onclick = () => closeTags(true);
document.getElementById('tagReset').onclick = () => { state.tags = []; renderTagList(); renderTagButton(); };
tagSearch.oninput = renderTagList;
modal.onclick = (e) => { if (e.target === modal) closeTags(true); };
document.getElementById('home').onclick = () => {
  state.tags = [];
  onFiltersChanged();
};

function onFiltersChanged() {
  syncUrl();
  renderTagButton();
  renderActiveBar();
  renderList();
}

async function loadTags() {
  try {
    state.allTags = await api('/tags');
    renderTagButton();
    renderActiveBar();
  } catch { /* фильтр необязателен */ }
}

async function renderList() {
  state.page = 1;
  const grid = $('div', 'grid');
  const more = $('div', 'more');
  const btn = $('button', 'primary', 'Показать ещё');
  btn.onclick = () => loadPage();
  more.append(btn);

  const body = $('div', 'wrap');
  body.append(grid, more);
  mount(body);

  state.grid = grid;
  state.more = more;
  await loadPage();
}

async function loadPage() {
  try {
    const qs = new URLSearchParams({ page: String(state.page) });
    for (const t of state.tags) qs.append('tag', t);
    if (state.sort === 'old') qs.set('sort', 'old');

    const items = await api('/manga?' + qs.toString());
    if (!items.length) {
      if (state.page === 1) {
        state.grid.replaceChildren($('div', 'msg', state.tags.length
          ? 'По выбранным тегам ничего нет — убери один из них'
          : 'Пустой ответ'));
      }
      state.more.remove();
      return;
    }
    for (const m of items) state.grid.append(cardEl(m));
    state.page += 1;
    if (items.length < 20) state.more.remove();
  } catch (e) {
    app.append($('div', 'err', 'Ошибка каталога: ' + e.message));
  }
}

function cardEl(m) {
  const card = $('div', 'card');
  const cover = $('div', 'cover');
  const img = $('img');
  img.loading = 'lazy'; img.decoding = 'async'; img.src = m.cover || ''; img.alt = m.title;
  cover.append(img);
  const src = (m.sources || []).map((x) => x.source).join('+');
  card.append(cover, $('div', 't', m.title), $('div', 'a', [m.author, src].filter(Boolean).join(' · ')));
  card.onclick = () => renderManga(m.id);
  return card;
}

function backToCatalog() {
  if (state.catalogEl && !state.catalogEl.isConnected) {
    document.body.classList.remove('reader');
    app.replaceChildren(state.catalogEl);
    requestAnimationFrame(() => window.scrollTo(0, state.catalogScroll || 0));
    return;
  }
  renderList();
}

async function renderManga(id) {
  state.mangaId = id;
  const grid = app.querySelector('.grid');
  if (grid) {
    state.catalogEl = app.querySelector('.wrap');
    state.catalogScroll = window.scrollY;
  }
  mount($('div', 'msg', 'Загрузка…'));
  try {
    const [m, chapters] = await Promise.all([api('/manga/' + id), api(`/manga/${id}/chapters`)]);
    state.chapters = chapters;

    const hero = $('div', 'hero');
    const cover = $('div', 'cover');
    const img = $('img'); img.src = m.cover || ''; img.alt = m.title; cover.append(img);
    const info = $('div');
    info.append($('h1', null, m.title));
    info.append($('div', 'meta', [m.author, `${chapters.length} гл.`, (m.sources || []).map((s) => s.source).join('+')].filter(Boolean).join(' · ')));
    if (m.genres?.length) {
      const chips = $('div', 'chips');
      for (const g of m.genres.slice(0, 8)) chips.append($('span', null, g));
      info.append(chips);
    }
    hero.append(cover, info);

    const list = $('div', 'chapters');
    chapters.forEach((c, i) => {
      const row = $('div', 'ch');
      const left = $('div', 'left');
      left.append($('span', 'n', 'Гл. ' + c.number), $('span', 'ttl', c.title || ''));
      const meta = [(c.date || '').slice(0, 10), c.source].filter(Boolean).join(' · ');
    row.append(left, $('div', 'd', meta));
      row.onclick = () => openChapter(i);
      list.append(row);
    });

    const back = $('button', null, '← Каталог');
    back.onclick = () => backToCatalog();
    const more = $('div', 'more'); more.append(back);

    const body = $('div', 'wrap');
    body.append(hero, list, more);
    mount(body);
  } catch (e) { mount($('div', 'err', 'Ошибка: ' + e.message)); }
}

async function openChapter(idx) {
  const c = state.chapters[idx];
  if (!c) return;
  state.chapterIdx = idx;
  document.body.classList.add('reader');
  mount($('div', 'msg', 'Загрузка главы…'));
  try {
    const data = await api(`/chapter/${c.id}/pages`);

    const view = $('div', 'reader-view');
    const bar = $('div', 'reader-bar');
    const backBtn = $('button', null, '←');
    backBtn.onclick = (e) => { e.stopPropagation(); leaveReader(); };
    bar.append(backBtn, $('div', 'ttl', `${c.title || 'Глава ' + c.number} · ${data.pages.length} стр.`));
    bar.onclick = toggleBars;

    const reader = $('div', 'reader');
    for (const src of data.pages) {
      const img = $('img'); img.loading = 'lazy'; img.decoding = 'async'; img.src = src; img.alt = '';
      reader.append(img);
    }

    const bottom = $('div', 'reader-bottom');
    const prev = $('button', null, '← Назад');
    const next = $('button', 'primary', 'Далее →');
    prev.disabled = idx === 0;
    next.disabled = idx === state.chapters.length - 1;
    prev.onclick = (e) => { e.stopPropagation(); goChapter(-1); };
    next.onclick = (e) => { e.stopPropagation(); goChapter(1); };
    bottom.append(prev, next);

    const zoneL = $('div', 'tapzone left'); zoneL.onclick = () => goChapter(-1);
    const zoneR = $('div', 'tapzone right'); zoneR.onclick = () => goChapter(1);

    view.append(bar, reader, bottom, zoneL, zoneR);
    mount(view);

    let x0 = null, y0 = null;
    view.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    view.addEventListener('touchend', (e) => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) goChapter(dx < 0 ? 1 : -1);
    }, { passive: true });
  } catch (e) { mount($('div', 'err', 'Ошибка главы: ' + e.message)); }
}

function leaveReader() {
  document.body.classList.remove('reader');
  renderManga(state.mangaId);
}

function goChapter(delta) {
  const ni = state.chapterIdx + delta;
  if (ni < 0 || ni >= state.chapters.length) { toast(delta > 0 ? 'Это последняя глава' : 'Это первая глава'); return; }
  openChapter(ni);
}

function toggleBars() {
  const bar = document.querySelector('.reader-bar');
  const bottom = document.querySelector('.reader-bottom');
  const hidden = !(bar && bar.classList.contains('hidden'));
  if (bar) bar.classList.toggle('hidden', hidden);
  if (bottom) { bottom.style.opacity = hidden ? 0 : 1; bottom.style.pointerEvents = hidden ? 'none' : 'auto'; }
}

renderTagButton();
renderActiveBar();
syncUrl();
loadTags();
renderList();
</script>
</body>
</html>
