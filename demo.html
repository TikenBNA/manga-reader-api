<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Манга</title>
<style>
  :root {
    --bg:#08080a; --surface:#121216; --surface2:#1a1a20; --line:#26262e;
    --text:#eaeaef; --dim:#74747f; --accent:#ff3b52; --accent2:#ff7a5c;
    --r:16px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html, body { background:var(--bg); }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--text); min-height:100vh; min-height:100dvh; overscroll-behavior-y: contain;
    padding-bottom:calc(66px + var(--safe-b));
  }
  body.reader { padding-bottom:0; }
  body.reader #topbar, body.reader #quickbar, body.reader #activebar, body.reader #bottomnav { display:none; }
  body.detail #quickbar { display:none; }
  html.app #topbar { padding-right:56px; }  /* место под шестерёнку в приложении */

  #topbar {
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:calc(10px + var(--safe-t)) 14px 10px;
    background:rgba(8,8,10,.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
  }
  .brand { font-size:17px; font-weight:800; letter-spacing:-.2px; white-space:nowrap; cursor:pointer;
    background:linear-gradient(100deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .searchbar { flex:1; display:flex; align-items:center; gap:8px; background:var(--surface2);
    border:1px solid var(--line); border-radius:12px; padding:0 12px; height:40px; }
  .searchbar svg { width:16px; height:16px; stroke:var(--dim); fill:none; stroke-width:2; flex:0 0 auto; }
  .searchbar input { flex:1; min-width:0; background:none; border:0; outline:none; color:var(--text); font-size:13.5px; font-family:inherit; }
  .searchbar input::placeholder { color:var(--dim); }

  #quickbar { display:flex; gap:8px; overflow-x:auto; padding:10px 14px; scrollbar-width:none; }
  #quickbar::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; background:var(--surface2); border:1px solid var(--line); color:#cfcfd6;
    border-radius:11px; padding:8px 14px; font-size:12.5px; font-family:inherit; min-height:36px; }
  .chip.on { background:linear-gradient(100deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; font-weight:600; }
  .chip.has { border-color:var(--accent); color:#fff; }

  #activebar[hidden] { display:none; }
  #activebar { display:flex; gap:6px; overflow-x:auto; padding:0 14px 10px; scrollbar-width:none; }
  #activebar::-webkit-scrollbar { display:none; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:var(--surface2); border:1px solid var(--line);
          color:#d6d6dd; border-radius:11px; padding:6px 10px; font-size:12px; white-space:nowrap; }
  .pill b { font-weight:600; }
  .pill .x { color:var(--accent); font-weight:700; cursor:pointer; padding:0 2px; }
  .pill.clear { border-color:var(--accent); color:var(--accent); cursor:pointer; }

  .wrap { padding:4px 14px 20px; max-width:1400px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 12px; }
  .card { cursor:pointer; position:relative; }
  .card .cover { aspect-ratio:3/4; background:var(--surface2); border-radius:var(--r); overflow:hidden; position:relative; }
  .card .cover::after { content:''; position:absolute; inset:0; border-radius:var(--r);
    box-shadow:inset 0 -40px 50px -30px rgba(0,0,0,.75); pointer-events:none; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease; }
  .card:active img { transform:scale(1.04); }
  .card .src { position:absolute; top:8px; left:8px; z-index:2; background:rgba(8,8,10,.62);
    backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.09); border-radius:9px;
    padding:3px 7px; font-size:10px; color:#e6e6ec; letter-spacing:.2px; }
  .card .t { margin-top:8px; font-size:12.5px; line-height:1.35; font-weight:500; max-height:2.7em; overflow:hidden; }
  .card .a { font-size:11px; color:var(--dim); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.hide { display:none; }

  .hero { display:flex; gap:14px; padding:14px; background:var(--surface); border:1px solid var(--line);
    border-radius:18px; margin:6px 0 14px; }
  .hero .cover { flex:0 0 112px; aspect-ratio:3/4; border-radius:12px; overflow:hidden; background:var(--surface2); }
  .hero img { width:100%; height:100%; object-fit:cover; }
  .hero h1 { font-size:17px; line-height:1.28; margin-bottom:6px; font-weight:700; }
  .hero .meta { color:var(--dim); font-size:12px; margin-bottom:9px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; max-height:52px; overflow:hidden; }
  .chips span { background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:3px 8px;
    font-size:11px; color:#bdbdc7; }

  .chapters { background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .ch { display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:52px;
    padding:12px 14px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .ch:last-child { border-bottom:none; }
  .ch:active { background:var(--surface2); }
  .ch .left { min-width:0; }
  .ch .n { color:var(--accent); font-weight:700; margin-right:6px; }
  .ch .ttl { display:block; color:#b6b6c0; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ch .d { color:var(--dim); font-size:11px; white-space:nowrap; }

  button { font-family:inherit; cursor:pointer; background:var(--surface2); color:#e2e2e8;
           border:1px solid var(--line); padding:11px 16px; border-radius:12px; font-size:14px; min-height:44px; }
  button.primary { background:linear-gradient(100deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; font-weight:600; }
  button:disabled { opacity:.35; }
  .msg { color:var(--dim); text-align:center; padding:60px 16px; font-size:13.5px; }
  .err { color:#ff6b6b; text-align:center; padding:24px; font-size:14px; }
  .favhead { padding:16px 2px 8px; font-size:15px; font-weight:700; color:var(--text); }
  .more { padding:18px 0 4px; display:flex; justify-content:center; }
  .more button { width:100%; max-width:420px; }

  #bottomnav { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; align-items:center;
    justify-content:space-around; padding:8px 6px calc(8px + var(--safe-b));
    background:rgba(8,8,10,.94); backdrop-filter:blur(14px); border-top:1px solid var(--line); }
  .navitem { display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0;
    color:var(--dim); font-size:10px; padding:4px 6px; min-height:0; min-width:56px; }
  .navitem svg { width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .navitem.on { color:var(--text); }
  .navcenter { width:46px; height:46px; min-height:0; padding:0; border-radius:50%; border:1px solid var(--line);
    background:linear-gradient(140deg,var(--surface2),#24242c); color:#fff; font-weight:800; font-size:17px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(255,59,82,.18); }

  .modal { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.66); display:flex; align-items:flex-end; }
  .modal[hidden] { display:none; }
  .sheet {
    background:var(--surface); width:100%; max-height:82vh; border-radius:20px 20px 0 0;
    border-top:1px solid var(--line);
    display:flex; flex-direction:column; padding-bottom:var(--safe-b);
  }
  .sheet header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .sheet header .title { font-weight:700; font-size:15px; }
  .sheet header .close { margin-left:auto; }
  .sheet .search { padding:12px 16px; }
  .sheet .search input { width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text);
                         border-radius:12px; padding:11px 13px; font-size:14px; outline:none; font-family:inherit; }
  .taglist { overflow-y:auto; padding:4px 14px 14px; display:flex; flex-wrap:wrap; gap:8px; }
  .taglist button {
    background:var(--surface2); border:1px solid var(--line); color:#d5d5dd; border-radius:11px;
    padding:8px 13px; font-size:12.5px; min-height:36px;
  }
  .taglist button.on { background:linear-gradient(100deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; font-weight:600; }
  .sheet footer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  .sheet footer button { flex:1; }

  .sortlist { overflow-y:auto; padding:6px 0 12px; }
  .opt { display:flex; align-items:center; gap:12px; padding:13px 18px; color:#d9d9e1; font-size:13.5px; cursor:pointer; }
  .opt:active { background:var(--surface2); }
  .opt .radio { width:20px; height:20px; border-radius:50%; border:1.6px solid #4a4a55; flex:0 0 auto; position:relative; }
  .opt.on .radio { border-color:var(--accent); }
  .opt.on .radio::after { content:''; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
  .sortsep { height:1px; background:var(--line); margin:8px 18px; }
  .sorthead { display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); }
  .sorthead .title { font-weight:700; font-size:15px; }
  .sorthead .x { margin-left:auto; color:#9a9aa6; font-size:20px; line-height:1; padding:0 4px; cursor:pointer; }
  .reader-view { background:#000; }
  .reader-bar {
    position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; gap:10px;
    padding:calc(10px + var(--safe-t)) 12px 10px;
    background:linear-gradient(180deg,rgba(0,0,0,.92),rgba(0,0,0,.35)); backdrop-filter:blur(10px);
    transition:opacity .2s, transform .2s;
  }
  .reader-bar.hidden { opacity:0; transform:translateY(-100%); pointer-events:none; }
  .reader-bar .ttl { flex:1; font-size:12.5px; color:#dcdce4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reader-bar button { min-height:38px; padding:7px 12px; font-size:13px; border-radius:11px;
    background:rgba(26,26,32,.8); backdrop-filter:blur(8px); }
  .reader { padding-top:calc(56px + var(--safe-t)); padding-bottom:calc(74px + var(--safe-b)); }
  .reader img { display:block; width:100%; max-width:820px; margin:0 auto; background:#0d0d10; }
  .reader-bottom {
    position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; gap:10px;
    padding:12px 14px calc(12px + var(--safe-b));
    background:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,.2)); backdrop-filter:blur(10px);
    transition:opacity .2s;
  }
  .reader-bottom button { flex:1; border-radius:14px; }
  .tapzone { position:fixed; top:0; bottom:0; width:30%; z-index:25; }
  .tapzone.left { left:0; }
  .tapzone.right { right:0; }

  .toast {
    position:fixed; left:50%; bottom:calc(92px + var(--safe-b)); transform:translateX(-50%);
    background:rgba(20,20,26,.94); border:1px solid var(--line); color:#eee; padding:10px 16px;
    border-radius:14px; font-size:13px; z-index:70; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show { opacity:1; }

  @media (min-width: 560px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px 14px; } }
  @media (min-width: 900px) { .grid { grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); } .wrap { padding:10px 24px 28px; } }</style>
</head>
<body>
<header id="topbar">
  <div class="brand" id="home">Манга</div>
  <label class="searchbar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
    <input id="searchInput" placeholder="Быстрый поиск" autocomplete="off" enterkeyhint="search">
  </label>
</header>
<nav id="quickbar">
  <button class="chip" id="sortBtn">Сортировка</button>
  <button class="chip" id="tagBtn">Теги</button>
  <button class="chip" id="favBtn">Избранное</button>
</nav>
<div id="activebar" hidden></div>

<div id="app"><div class="msg">Загрузка…</div></div>

<nav id="bottomnav">
  <button class="navitem on" data-nav="catalog">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg>
    <span>Каталог</span>
  </button>
  <button class="navitem" data-nav="tags">
    <svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7-7A2 2 0 0 1 3 12.2V5a2 2 0 0 1 2-2h7.2a2 2 0 0 1 1.4.6l7 7a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.3"></circle></svg>
    <span>Теги</span>
  </button>
  <button class="navcenter" data-nav="top">М</button>
  <button class="navitem" data-nav="random">
    <svg viewBox="0 0 24 24"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
    <span>Случайно</span>
  </button>
  <button class="navitem" data-nav="info">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
    <span>Инфо</span>
  </button>
</nav>
<div class="modal" id="tagModal" hidden>
  <div class="sheet">
    <header>
      <span class="title">Теги</span>
      <button class="close" id="tagClose">Готово</button>
    </header>
    <div class="search"><input id="tagSearch" placeholder="Поиск тега…" autocomplete="off"></div>
    <div class="taglist" id="tagList"></div>
    <footer>
      <button id="tagReset">Сбросить</button>
      <button class="primary" id="tagApply">Применить</button>
    </footer>
  </div>
</div>

<div class="modal" id="sortModal" hidden>
  <div class="sheet">
    <div class="sorthead">
      <span class="title">Сортировка</span>
      <span class="x" id="sortClose">✕</span>
    </div>
    <div class="sortlist" id="sortList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = location.origin + '/api';
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
const $ = (t, cls, txt) => { const el = document.createElement(t); if (cls) el.className = cls; if (txt != null) el.textContent = txt; return el; };
if (/; wv\)/.test(navigator.userAgent)) document.documentElement.classList.add('app');

const params = new URLSearchParams(location.search);
const state = {
  tags: (params.get('tags') || '').split(',').map((s) => s.trim()).filter(Boolean),
  sort: ['new','old','az','za'].includes(params.get('sort')) ? params.get('sort') : 'new',
  page: 1,
  allTags: [],
  mangaId: null,
  chapters: [],
  chapterIdx: 0,
  loadingPage: false,
  sortField: (params.get('sort') === 'az' || params.get('sort') === 'za') ? 'title' : 'date',
  sortDir: (params.get('sort') === 'old' || params.get('sort') === 'az') ? 'asc' : 'desc',
  cache: new Map(),
};

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => toastEl.classList.remove('show'), 1500);
}

async function api(path) {
  if (state.cache.has(path)) return state.cache.get(path);
  const res = await fetch(API + path);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  state.cache.set(path, data);
  if (state.cache.size > 80) state.cache.delete(state.cache.keys().next().value);
  return data;
}

function syncUrl() {
  const p = new URLSearchParams();
  if (state.tags.length) p.set('tags', state.tags.join(','));
  if (state.sort !== 'new') p.set('sort', state.sort);
  const qs = p.toString();
  history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}


/* Прогресс чтения: глава и страница каждой работы (localStorage, без сервера). */

/* Избранное и история просмотров — только в браузере (localStorage). */

/* Офлайн-главы: страницы качаются через серверный прокси /img и кладутся в Cache API. */
const PAGES_CACHE = "mr-pages-v1";
const offKey = (chId, i) => location.origin + "/offline/" + encodeURIComponent(chId) + "/" + i;
async function cacheGetPage(chId, i) {
  try { const c = await caches.open(PAGES_CACHE); return await c.match(offKey(chId, i)); } catch { return null; }
}
async function cachePutPage(chId, i, url) {
  const c = await caches.open(PAGES_CACHE);
  const res = await fetch("/img?u=" + encodeURIComponent(url));
  if (!res.ok) throw new Error("img " + res.status);
  await c.put(offKey(chId, i), res);
}
async function cachedCount(chId, total) {
  let n = 0;
  for (let i = 0; i < total; i++) if (await cacheGetPage(chId, i)) n++;
  return n;
}

const FAV_KEY = "mr:fav";
const HIST_KEY = "mr:hist";
function readMap(key) {
  try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch { return {}; }
}
function writeMap(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch { /* приватный режим */ }
}
const isFav = (id) => !!readMap(FAV_KEY)[id];
function toggleFav(item) {
  const all = readMap(FAV_KEY);
  if (all[item.id]) delete all[item.id];
  else all[item.id] = { id: item.id, title: item.title, cover: item.cover, t: Date.now() };
  writeMap(FAV_KEY, all);
  return !!all[item.id];
}
function pushHistory(item) {
  if (!item || !item.id) return;
  const all = readMap(HIST_KEY);
  all[item.id] = { id: item.id, title: item.title, cover: item.cover, t: Date.now() };
  const keys = Object.keys(all).sort((a, b) => all[b].t - all[a].t).slice(0, 40);
  const trimmed = {};
  for (const k of keys) trimmed[k] = all[k];
  writeMap(HIST_KEY, trimmed);
}
const favCount = () => Object.keys(readMap(FAV_KEY)).length;

const PROGRESS_KEY = "mr:progress";
function readProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}"); } catch { return {}; }
}
function saveProgress(id, chapterId, page) {
  if (!id || !chapterId) return;
  const all = readProgress();
  all[id] = { c: chapterId, p: page || 0, t: Date.now() };
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(all)); } catch { /* приватный режим */ }
}
function getProgress(id) { return readProgress()[id] || null; }

function mount(...nodes) {
  app.replaceChildren(...nodes);
  window.scrollTo(0, 0);
}

const tagBtn = document.getElementById('tagBtn');
  const favBtn = document.getElementById('favBtn');
const sortBtn = document.getElementById('sortBtn');
const sortModal = document.getElementById('sortModal');
const sortListEl = document.getElementById('sortList');
const activebar = document.getElementById('activebar');
const modal = document.getElementById('tagModal');
const tagList = document.getElementById('tagList');
const tagSearch = document.getElementById('tagSearch');

const searchInput = document.getElementById('searchInput');

const SORT_FIELDS = [
  { id: 'date', name: 'Дата добавления' },
  { id: 'title', name: 'По названию' },
];
const SORT_DIRS = [
  { id: 'desc', name: 'По убыванию' },
  { id: 'asc', name: 'По возрастанию' },
];

function sortCode() {
  if (state.sortField === 'title') return state.sortDir === 'desc' ? 'za' : 'az';
  return state.sortDir === 'desc' ? 'new' : 'old';
}

function renderSort() {
  const label = (SORT_FIELDS.find((f) => f.id === state.sortField) || SORT_FIELDS[0]).name;
  sortBtn.textContent = label + (state.sortDir === 'desc' ? ' ↓' : ' ↑');
}

function renderSortList() {
  sortListEl.replaceChildren();
  const add = (id, name, group) => {
    const row = document.createElement('div');
    const active = group === 'field'
      ? state.sortField === id
      : state.sortDir === id;
    row.className = 'opt' + (active ? ' on' : '');
    const radio = document.createElement('span'); radio.className = 'radio';
    const txt = document.createElement('span'); txt.textContent = name;
    row.append(radio, txt);
    row.onclick = () => {
      if (group === 'field') state.sortField = id; else state.sortDir = id;
      state.sort = sortCode();
      renderSortList(); renderSort();
      sortModal.hidden = true;
      document.body.style.overflow = '';
      onFiltersChanged();
    };
    sortListEl.append(row);
  };
  SORT_FIELDS.forEach((f) => add(f.id, f.name, 'field'));
  const sep = document.createElement('div'); sep.className = 'sortsep';
  sortListEl.append(sep);
  const isTitle = state.sortField === 'title';
  SORT_DIRS.forEach((d) => {
    const name = isTitle
      ? (d.id === 'desc' ? 'По убыванию (Я-А)' : 'По возрастанию (А-Я)')
      : d.name;
    add(d.id, name, 'dir');
  });
}

sortBtn.onclick = () => {
  renderSortList();
  sortModal.hidden = false;
  document.body.style.overflow = 'hidden';
};
document.getElementById('sortClose').onclick = () => { sortModal.hidden = true; document.body.style.overflow = ''; };
sortModal.onclick = (e) => { if (e.target === sortModal) { sortModal.hidden = true; document.body.style.overflow = ''; } };

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim();
  if (!state.grid) return;

  // 1 символ — фильтруем уже загруженные карточки (мгновенно, без сети)
  if (q.length < 2) {
    state.grid.querySelectorAll(".card").forEach((c) => {
      const hit = !q || (c.dataset.title || "").includes(q.toLowerCase());
      c.classList.toggle("hide", !hit);
    });
    return;
  }

  // 2+ символа — ищем по всему каталогу на сервере (с задержкой, чтобы не спамить)
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(async () => {
    try {
      const items = await api("/manga?q=" + encodeURIComponent(q) + "&sort=" + state.sort);
      state.page = 1;
      state.grid.replaceChildren();
      if (!items.length) {
        state.grid.append($("div", "msg", "Ничего не найдено"));
        if (state.more) state.more.remove();
        return;
      }
      for (const m of items) state.grid.append(cardEl(m));
      if (state.more) state.more.remove();
    } catch (e) { toast("Поиск недоступен"); }
  }, 300);
});

function renderTagButton() {
  const n = state.tags.length;
  tagBtn.textContent = n ? `Теги: ${n}` : 'Теги';
  tagBtn.classList.toggle('has', n > 0);
}

function renderFavButton() {
  const n = favCount();
  favBtn.textContent = n ? `Избранное: ${n}` : "Избранное";
  favBtn.classList.toggle("has", n > 0);
}

/** Экран «Избранное + История» (две секции карточек). */
function openFavorites() {
  const favs = Object.values(readMap(FAV_KEY)).sort((a, b) => b.t - a.t);
  const hist = Object.values(readMap(HIST_KEY)).sort((a, b) => b.t - a.t).slice(0, 20);
  const wrap = $("div", "wrap");
  const head = (title) => $("div", "favhead", title);

  wrap.append(head("Избранное"));
  if (!favs.length) wrap.append($("div", "msg", "Пока пусто — жми ♡ на карточке"));
  else {
    const grid = $("div", "grid");
    for (const it of favs) grid.append(cardEl(it));
    wrap.append(grid);
  }

  wrap.append(head("История"));
  if (!hist.length) wrap.append($("div", "msg", "Здесь появятся открытые работы"));
  else {
    const grid2 = $("div", "grid");
    for (const it of hist) grid2.append(cardEl(it));
    wrap.append(grid2);
  }

  const back = $("button", null, "← Каталог");
  back.onclick = () => backToCatalog();
  const more = $("div", "more"); more.append(back);
  wrap.append(more);
  mount(wrap);
  renderFavButton();
}

function renderActiveBar() {
  activebar.replaceChildren();
  if (!state.tags.length) { activebar.hidden = true; return; }
  activebar.hidden = false;
  for (const slug of state.tags) {
    const name = (state.allTags.find((t) => (t.key || t.slug) === slug) || {}).name || slug;
    const pill = $('span', 'pill');
    pill.append($('b', null, name));
    const x = $('span', 'x', '✕');
    x.onclick = () => { state.tags = state.tags.filter((s) => s !== slug); onFiltersChanged(); };
    pill.append(x);
    activebar.append(pill);
  }
  const clear = $('span', 'pill clear', 'Сбросить всё');
  clear.onclick = () => { state.tags = []; onFiltersChanged(); };
  activebar.append(clear);
}

function renderTagList() {
  const q = tagSearch.value.trim().toLowerCase();
  tagList.replaceChildren();
  const list = state.allTags.filter((t) => !q || t.name.toLowerCase().includes(q));
  if (!list.length) { tagList.append($('div', 'msg', 'Ничего не найдено')); return; }
  for (const t of list) {
    const tagVal = t.key || t.slug;
    const b = $('button', state.tags.includes(tagVal) ? 'on' : null, t.name);
    b.onclick = () => {
      state.tags = state.tags.includes(tagVal)
        ? state.tags.filter((s) => s !== tagVal)
        : [...state.tags, tagVal];
      renderTagList();
      renderTagButton();
    };
    tagList.append(b);
  }
}

function openTags() {
  renderTagList();
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeTags(apply) {
  modal.hidden = true;
  document.body.style.overflow = '';
  renderTagButton();
  renderFavButton();
  renderActiveBar();
  if (apply) onFiltersChanged();
}

tagBtn.onclick = openTags;
  favBtn.onclick = openFavorites;
document.getElementById('tagClose').onclick = () => closeTags(true);
document.getElementById('tagApply').onclick = () => closeTags(true);
document.getElementById('tagReset').onclick = () => { state.tags = []; renderTagList(); renderTagButton(); };
tagSearch.oninput = renderTagList;
modal.onclick = (e) => { if (e.target === modal) closeTags(true); };
document.getElementById('home').onclick = () => {
  state.tags = [];
  onFiltersChanged();
};

function onFiltersChanged() {
  syncUrl();
  renderTagButton();
  renderFavButton();
  renderActiveBar();
  renderList();
}

async function loadTags() {
  try {
    state.allTags = await api('/tags');
    renderTagButton();
    renderActiveBar();
  } catch { /* фильтр необязателен */ }
}

async function renderList() {
  document.body.classList.remove('detail');
  state.page = 1;
  const grid = $('div', 'grid');
  const more = $('div', 'more');
  const btn = $('button', 'primary', 'Показать ещё');
  btn.onclick = () => loadPage(btn);
  more.append(btn);

  const body = $('div', 'wrap');
  body.append(grid, more);
  mount(body);

  state.grid = grid;
  state.more = more;
  await loadPage(btn);
}

async function loadPage(btn) {
  // защита от двойного нажатия: пока идёт загрузка, второй запрос не уходит
  if (state.loadingPage) return;
  state.loadingPage = true;
  if (btn) btn.disabled = true;
  const requested = state.page;

  try {
    const qs = new URLSearchParams({ page: String(requested) });
    for (const t of state.tags) qs.append('tag', t);
    if (state.sort !== 'new') qs.set('sort', state.sort);

    const items = await api('/manga?' + qs.toString());
    // пока грузили, фильтры сбросили список — этот ответ уже не нужен
    if (requested !== state.page) return;

    if (!items.length) {
      if (state.page === 1) {
        state.grid.replaceChildren($('div', 'msg', state.tags.length
          ? 'По выбранным тегам ничего нет — убери один из них'
          : 'Пустой ответ'));
      }
      state.more.remove();
      return;
    }
    for (const m of items) state.grid.append(cardEl(m));
    state.page += 1;
    if (items.length < 20) state.more.remove();
  } catch (e) {
    app.append($('div', 'err', 'Ошибка каталога: ' + e.message));
  } finally {
    state.loadingPage = false;
    if (btn && state.more && state.more.isConnected) btn.disabled = false;
  }
}

function cardEl(m) {
  const card = $('div', 'card');
  card.dataset.title = (m.title || '').toLowerCase();
  const cover = $('div', 'cover');
  const img = $('img');
  img.loading = 'lazy'; img.decoding = 'async'; img.referrerPolicy = 'no-referrer'; img.src = m.cover || ''; img.alt = m.title;
  cover.append(img);
  const src = (m.sources || []).map((x) => x.source).join('+');
  if (src) cover.append($('span', 'src', src));
  card.append(cover, $('div', 't', m.title), $('div', 'a', m.author || ''));
  card.onclick = () => renderManga(m.id);
  return card;
}

/** Системная кнопка «назад» в приложении: сначала выходим из читалки/карточки, иначе отдаём ОС. */
window.mangaBack = function () {
  if (document.body.classList.contains('reader')) {
    document.body.classList.remove('reader');
    renderManga(state.mangaId);
    return true;
  }
  if (document.body.classList.contains('detail')) {
    backToCatalog();
    return true;
  }
  return false;
};

/** Возврат на главный экран из карточки/читалки. */
function leaveToCatalog() {
  document.body.classList.remove('reader');
  if (document.body.classList.contains('detail')) {
    backToCatalog();
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
function backToCatalog() {
  // классы нужно снимать всегда: иначе после возврата остаётся body.detail
  // и CSS прячет строку с кнопками «Сортировка» и «Теги»
  document.body.classList.remove('reader');
  document.body.classList.remove('detail');
  if (state.catalogEl && !state.catalogEl.isConnected) {
    app.replaceChildren(state.catalogEl);
    requestAnimationFrame(() => window.scrollTo(0, state.catalogScroll || 0));
    return;
  }
  renderList();
}

async function renderManga(id) {
  document.body.classList.add('detail');
  state.mangaId = id;
  const grid = app.querySelector('.grid');
  if (grid) {
    state.catalogEl = app.querySelector('.wrap');
    state.catalogScroll = window.scrollY;
  }
  mount($('div', 'msg', 'Загрузка…'));
  try {
    const [m, chapters] = await Promise.all([api('/manga/' + id), api(`/manga/${id}/chapters`)]);
    state.chapters = chapters;
    pushHistory({ id, title: m.title, cover: m.cover });

    const hero = $('div', 'hero');
    const cover = $('div', 'cover');
    const img = $('img'); img.referrerPolicy = 'no-referrer'; img.src = m.cover || ''; img.alt = m.title; cover.append(img);
    const info = $('div');
    info.append($('h1', null, m.title));
    info.append($('div', 'meta', [m.author, `${chapters.length} гл.`, (m.sources || []).map((s) => s.source).join('+')].filter(Boolean).join(' · ')));
    if (m.genres?.length) {
      const chips = $('div', 'chips');
      for (const g of m.genres.slice(0, 8)) chips.append($('span', null, g));
      info.append(chips);
    }
    hero.append(cover, info);

    // «Продолжить»: последняя читавшаяся глава и страница
    const prog = getProgress(id);
    const progIdx = prog ? chapters.findIndex((c) => c.id === prog.c) : -1;
    let resumeBlock = null;
    if (progIdx >= 0) {
      resumeBlock = $('div', 'more');
      const cont = $('button', 'primary', 'Продолжить: Гл. ' + (chapters[progIdx].number ?? '') + ' · стр. ' + ((prog.p || 0) + 1));
      cont.onclick = () => openChapter(progIdx, prog.p || 0);
      resumeBlock.append(cont);
    }
    const list = $('div', 'chapters');
    chapters.forEach((c, i) => {
      const row = $('div', 'ch');
      const left = $('div', 'left');
      left.append($('span', 'n', 'Гл. ' + c.number), $('span', 'ttl', c.title || ''));
      const meta = [(c.date || '').slice(0, 10), c.source].filter(Boolean).join(' · ');
    row.append(left, $('div', 'd', meta));
      row.onclick = () => openChapter(i);
      list.append(row);
    });

    const fav = $("button", null, isFav(id) ? "♥ В избранном" : "♡ В избранное");
    fav.onclick = () => { const on = toggleFav({ id, title: m.title, cover: m.cover }); fav.textContent = on ? "♥ В избранном" : "♡ В избранное"; renderFavButton(); toast(on ? "Добавлено в избранное" : "Убрано из избранного"); };
    const back = $('button', null, '← Каталог');
    back.onclick = () => backToCatalog();
    const more = $('div', 'more'); more.append(fav, back);

    const body = $('div', 'wrap');
    if (resumeBlock) body.append(hero, resumeBlock, list, more); else body.append(hero, list, more);
    mount(body);

    // свайп вправо по карточке — назад в каталог
    let sx = null, sy = null;
    body.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    body.addEventListener('touchend', (e) => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (dx > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) backToCatalog();
    }, { passive: true });
  } catch (e) { mount($('div', 'err', 'Ошибка: ' + e.message)); }
}

async function openChapter(idx, resumePage) {
  const c = state.chapters[idx];
  if (!c) return;
  state.chapterIdx = idx;
  document.body.classList.add('reader');
  mount($('div', 'msg', 'Загрузка главы…'));
  try {
    const data = await api(`/chapter/${c.id}/pages`);

    const view = $('div', 'reader-view');
    const bar = $('div', 'reader-bar');
    const backBtn = $('button', null, '←');
    backBtn.onclick = (e) => { e.stopPropagation(); leaveReader(); };
    bar.append(backBtn, $('div', 'ttl', `${c.title || 'Глава ' + c.number} · ${data.pages.length} стр.`));
    const dlBtn = $("button", null, "⤓");
    dlBtn.title = "Скачать главу для офлайна";
    dlBtn.onclick = async (ev) => {
      ev.stopPropagation();
      if (dlBtn.disabled) return;
      dlBtn.disabled = true;
      const total = data.pages.length;
      let done = 0;
      for (let pi = 0; pi < total; pi++) {
        if (!(await cacheGetPage(c.id, pi))) {
          try { await cachePutPage(c.id, pi, data.pages[pi]); } catch { /* страница не скачалась */ }
        }
        done++;
        dlBtn.textContent = done + "/" + total;
      }
      dlBtn.textContent = "✓ офлайн";
      dlBtn.disabled = false;
      toast("Глава сохранена: " + total + " стр.");
    };
    bar.append(dlBtn);
    cachedCount(c.id, data.pages.length).then((n) => { if (n === data.pages.length) dlBtn.textContent = "✓ офлайн"; }).catch(() => {});
    bar.onclick = toggleBars;

    const reader = $('div', 'reader');
    // если страницы уже скачаны — показываем их из кэша (работает и без сети)
    const cachedPages = [];
    for (let pi = 0; pi < data.pages.length; pi++) {
      const hit = await cacheGetPage(c.id, pi);
      cachedPages.push(hit ? URL.createObjectURL(await hit.blob()) : null);
    }
    let pageIdx = -1;
    for (const src of data.pages) {
      pageIdx++;
      const useSrc = cachedPages[pageIdx] || src;
      const img = $("img"); img.loading = "lazy"; img.decoding = "async"; img.referrerPolicy = "no-referrer"; img.src = useSrc; img.alt = "";
      reader.append(img);
    }

    const bottom = $('div', 'reader-bottom');
    const prev = $('button', null, '← Назад');
    const next = $('button', 'primary', 'Далее →');
    prev.disabled = idx === 0;
    next.disabled = idx === state.chapters.length - 1;
    prev.onclick = (e) => { e.stopPropagation(); goChapter(-1); };
    next.onclick = (e) => { e.stopPropagation(); goChapter(1); };
    bottom.append(prev, next);

    const zoneL = $('div', 'tapzone left'); zoneL.onclick = () => goChapter(-1);
    const zoneR = $('div', 'tapzone right'); zoneR.onclick = () => goChapter(1);

    view.append(bar, reader, bottom, zoneL, zoneR);
    mount(view);

    // прогресс: запоминаем главу и восстанавливаем страницу
    state.chapterId = c.id;
    state.readerImgs = [...reader.querySelectorAll("img")];
    saveProgress(state.mangaId, c.id, resumePage || 0);
    if (resumePage) {
      requestAnimationFrame(() => {
        const img = state.readerImgs[resumePage];
        if (img) window.scrollTo(0, Math.max(0, img.offsetTop - 8));
      });
    }

    let x0 = null, y0 = null;
    view.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    view.addEventListener('touchend', (e) => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) goChapter(dx < 0 ? 1 : -1);
    }, { passive: true });
  } catch (e) { mount($('div', 'err', 'Ошибка главы: ' + e.message)); }
}

function leaveReader() {
  document.body.classList.remove('reader');
  renderManga(state.mangaId);
}

function goChapter(delta) {
  const ni = state.chapterIdx + delta;
  if (ni < 0) { leaveReader(); return; }
  if (ni >= state.chapters.length) { toast('Это последняя глава'); return; }
  openChapter(ni);
}

function toggleBars() {
  const bar = document.querySelector('.reader-bar');
  const bottom = document.querySelector('.reader-bottom');
  const hidden = !(bar && bar.classList.contains('hidden'));
  if (bar) bar.classList.toggle('hidden', hidden);
  if (bottom) { bottom.style.opacity = hidden ? 0 : 1; bottom.style.pointerEvents = hidden ? 'none' : 'auto'; }
}

document.getElementById('bottomnav').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-nav]');
  if (!btn) return;
  const nav = btn.dataset.nav;
  if (nav === 'catalog') { state.tags = []; searchInput.value = ''; onFiltersChanged(); }
  if (nav === 'tags') openTags();
  if (nav === 'top') {
    if (document.body.classList.contains('detail') || document.body.classList.contains('reader')) {
      leaveToCatalog();
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }
  if (nav === 'random') randomManga();
  if (nav === 'info') showInfo();
});

async function randomManga() {
  try {
    const page = 1 + Math.floor(Math.random() * 120);
    const items = await api('/manga?page=' + page);
    if (!items.length) { toast('Пусто'); return; }
    const pick = items[Math.floor(Math.random() * items.length)];
    renderManga(pick.id);
  } catch (e) { toast('Не вышло: ' + e.message); }
}

async function showInfo() {
  try {
    const h = await fetch('/health').then((r) => r.json());
    toast('Работ в каталоге: ' + (h.mergedWorks || 0));
  } catch { toast('Сервер недоступен'); }
}

renderSort();
renderTagButton();
renderActiveBar();
syncUrl();
loadTags();
renderList();

// Один обработчик на всё приложение: пока открыта читалка, раз в 600 мс сохраняем страницу.
let progressTimer = null;
window.addEventListener("scroll", () => {
  if (!document.body.classList.contains("reader") || !state.readerImgs || !state.chapterId) return;
  if (progressTimer) return;
  progressTimer = setTimeout(() => {
    progressTimer = null;
    const top = window.scrollY + 12;
    let page = 0;
    for (let i = 0; i < state.readerImgs.length; i++) {
      if (state.readerImgs[i].offsetTop <= top) page = i;
    }
    saveProgress(state.mangaId, state.chapterId, page);
  }, 600);
}, { passive: true });
</script>
</body>
</html>
