<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Манга</title>
<style>
  body { background:#121212; color:#e0e0e0; font-family: system-ui, sans-serif; margin:0; padding:40px 20px; text-align:center; }
  h1 { color:#ff6b35; font-size:20px; }
  p { color:#888; font-size:14px; line-height:1.6; }
  a { display:inline-block; margin:6px 4px; padding:10px 18px; border-radius:8px; background:#2a2a2a; color:#ffb08a; text-decoration:none; font-size:13px; }
  a.primary { background:#ff6b35; color:#fff; }
</style>
<script>
  // Адреса туннелей обновляет tools/watchdog.ps1 — самый свежий первым.
  var TARGET = 'https://tiken-manga.serveousercontent.com/demo?serveo-skip-browser-warning=true';
  var CANDIDATES = ['https://tiken-manga.serveousercontent.com/demo?serveo-skip-browser-warning=true', 'https://f65c8c94ad9301.lhr.life/demo', 'https://8c03e27e6542e9.lhr.life/demo'];
</script>
</head>
<body>
  <h1>Манга</h1>
  <p id="status">Проверяю соединение…</p>
  <p id="links"></p>
  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var linksEl = document.getElementById('links');
      var list = (CANDIDATES && CANDIDATES.length ? CANDIDATES : [TARGET]).filter(Boolean);

      list.forEach(function (url, i) {
        var a = document.createElement('a');
        a.href = url;
        a.textContent = i === 0 ? 'Открыть читалку' : 'Резервный адрес ' + i;
        if (i === 0) a.className = 'primary';
        linksEl.appendChild(a);
      });

      function tryAt(i) {
        if (i >= list.length) {
          statusEl.textContent = 'Сервер недоступен — пробую снова…';
          setTimeout(function () { tryAt(0); }, 5000);
          return;
        }
        var url = list[i];
        var base = url.replace(/\/demo.*$/, '');
        var finished = false;
        var timer = setTimeout(function () {
          if (finished) return;
          finished = true;
          tryAt(i + 1);
        }, 3000);
        statusEl.textContent = 'Подключаюсь… (' + (i + 1) + '/' + list.length + ')';
        // важно: mode 'cors' + проверка JSON — иначе 502 от туннеля выглядит как успех
        fetch(base + '/health', { mode: 'cors', cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http')); })
          .then(function (data) {
            if (finished) return;
            if (!data || data.ok !== true) throw new Error('bad health');
            finished = true;
            clearTimeout(timer);
            location.replace(url);
          })
          .catch(function () {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            tryAt(i + 1);
          });
      }

      tryAt(0);
    })();
  </script>
</body>
</html>
